version: 1
track: track_a
description: >-
  Reproducible Track A K-Means/GMM experiments on the real P1 model matrix.
  The input is already log-transformed and standardized by the persisted P1
  preprocessor; this runner does not fit or apply another scaler.

data:
  model_file: data/processed/track_a/track_a_features_model.csv
  identifier_column: CustomerID
  feature_contract_file: configs/models/feature_contracts.yaml
  preprocessor_artifact: artifacts/preprocessors/track_a.joblib
  # Explicit contract order; the sampler reorders each chunk to this order.
  features:
    - AccountBalance
    - Transaction_Count
    - Avg_Transaction_Amt
    - Std_Transaction_Amt
    - Total_Spend
    - Avg_Spend_Ratio
    - Recency_Days
    - Weekend_Spend_Ratio
    - Night_Spend_Ratio
  input_representation: p1_model_matrix_already_scaled
  chunk_rows: 50000

sampling:
  evaluation_rows: 3000
  evaluation_seed: 8675309
  smoke:
    training_rows: 10000
    seeds: [42]
    k: 3
  comparison:
    training_rows: 50000
    seeds: [42, 2024]
    k_values: [2, 3, 4, 5, 6]

metrics:
  silhouette_max_rows: 3000
  silhouette_seed: 13579

algorithms:
  kmeans:
    n_init: 10
    max_iter: 300
    algorithm: lloyd
  gaussian_mixture:
    covariance_type: diag
    reg_covar: 0.000001
    n_init: 1
    max_iter: 200
    tol: 0.001

execution:
  thread_limit: 1
  # Keep all outputs versioned. Existing experiment rows/files are never replaced.
  comparison_board: artifacts/experiments/bakeoffs/comparison_board.csv
  sample_manifests: artifacts/experiments/samples
  model_directory: artifacts/models/baselines
  assignment_directory: artifacts/segments/candidates
  run_metadata_directory: artifacts/experiments/run_metadata
  mlflow_experiment: track-a-baselines
