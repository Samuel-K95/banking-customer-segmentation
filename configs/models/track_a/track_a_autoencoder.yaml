version: 1
track: track_a
description: >-
  CPU PyTorch autoencoder and latent K-Means experiments using the exact
  Track A Task 05 training and evaluation customer manifests.

data:
  model_file: data/processed/track_a_features_model.csv
  interpretable_file: data/processed/track_a_features_interpretable.csv
  identifier_column: CustomerID
  feature_contract_file: configs/models/feature_contracts.yaml
  preprocessor_artifact: artifacts/preprocessors/track_a.joblib
  input_representation: p1_model_matrix_already_scaled
  chunk_rows: 50000
  row_count: 837951
  features:
    - AccountBalance
    - Transaction_Count
    - Avg_Transaction_Amt
    - Std_Transaction_Amt
    - Total_Spend
    - Avg_Spend_Ratio
    - Recency_Days
    - Weekend_Spend_Ratio
    - Night_Spend_Ratio
  ablation_feature: Avg_Spend_Ratio

sampling:
  evaluation_manifest: artifacts/experiments/samples/track_a_evaluation_n3000_5496dbb5ee72.csv
  train_manifests:
    "42": artifacts/experiments/samples/track_a_comparison_train_seed42_n50000_d23d078cbe1c.csv
    "2024": artifacts/experiments/samples/track_a_comparison_train_seed2024_n50000_889a5996e041.csv
  expected_training_rows: 50000
  expected_evaluation_rows: 3000
  internal_validation_fraction: 0.1
  internal_validation_seed_offset: 91731
  smoke:
    seeds: [42]
    feature_sets: [nine_feature]
    k_values: [2]
  comparison:
    seeds: [42, 2024]
    feature_sets: [nine_feature, eight_feature_no_ratio]
    k_values: [2, 3, 4]
    run_eight_feature_traditional_kmeans: true

autoencoder:
  hidden_dims: [32, 16]
  latent_dim: 4
  activation: ReLU
  latent_activation: linear
  reconstruction_activation: linear
  loss: SmoothL1Loss
  huber_beta: 1.0
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 512
  max_epochs: 80
  early_stopping_patience: 10
  early_stopping_min_delta: 0.00001
  loss_divergence_factor: 100.0
  max_loss: 1000000.0
  device: cpu
  num_threads: 1
  deterministic_algorithms: true

clustering:
  algorithm: KMeans
  n_init: 10
  max_iter: 300
  init: k-means++
  algorithm_variant: lloyd

metrics:
  silhouette_max_rows: 3000
  silhouette_seed: 13579
  metric_spaces:
    original_nine: original_p1_9d
    original_eight: original_p1_8d
    original_nine_reference: original_p1_9d_reference
    latent: scaled_latent_4d

execution:
  comparison_board: artifacts/experiments/bakeoffs/comparison_board.csv
  model_directory: artifacts/models/autoencoder
  history_directory: artifacts/experiments/autoencoder_history
  assignment_directory: artifacts/segments/candidates
  profile_directory: artifacts/experiments/segment_profiles
  run_metadata_directory: artifacts/experiments/run_metadata
  internal_split_directory: artifacts/experiments/samples
  mlflow_experiment: track-a-autoencoder
