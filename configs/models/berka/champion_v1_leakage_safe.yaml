version: 1
experiment: champion_v1_leakage_safe
description: >-
  Leakage-safe retrain of the CRM champion feature family (8 RFM+product columns)
  under Mahider-style discipline: fixed as-of, tenure gate, shared account split,
  train-only scaler + AE + K-Means. Product champion remains k=6 (AE lat=4);
  parallel k=2 on the same matrix is a research twin, not a CRM replacement.

data:
  as_of_date: "1997-12-31"
  minimum_tenure_days: 365
  identifier_column: account_id
  output_directory: artifacts/segmentation/research/leakage_safe_source

split:
  training_fraction: 0.75
  random_seed: 8675309

model:
  feature_version: berka_rfm_product_v1_leakage_safe
  model_version: v1_leakage_safe
  champion_run_id: c_ae_lat4_k6_leakage_safe
  latent_dim: 4
  n_clusters: 6
  parallel_kmeans_k: 2
  epochs: 50
  random_state: 42
  model_seeds: [42, 2024, 123]

gates:
  note: >-
    Freeze remains BLOCKED until independent prospective validation, fairness /
    OWNER-DISPONENT policy, and a pinned serving contract are approved.
  tiny_segments_policy: exception_queue_not_mass_campaign
